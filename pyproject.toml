[project]
name = "localai"
version = "0.1.0"
description = "A lightweight, privacy-first workspace for local LLM inference, document intelligence, and performance benchmarking."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "streamlit>=1.35.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pandas>=2.2.0",
    "altair>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
